---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: can-mssql-candidate
  namespace: tools-argocd
spec:
  project: canaries
  source:
    path: canaries/otel-mssql
    repoURL: git@source.datanerd.us:data-integrations/database-corient-canaries.git
    targetRevision: master
    helm:
      releaseName: mssql-candidate
      valueFiles:
        - otel-collector-values.yaml
        - values.yaml
        - values-candidate.yaml
      parameters:
        - name: environment
          value: candidate
  destination:
    namespace: can-mssql-candidate
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
