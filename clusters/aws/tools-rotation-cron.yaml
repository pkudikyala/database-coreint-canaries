---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools-rotation-cron
  namespace: tools-argocd
spec:
  project: cluster-meta
  source:
    path: tools/rotation-cron
    repoURL: git@source.datanerd.us:data-integrations/database-corient-canaries.git
    targetRevision: master
  destination:
    namespace: tools-rotation-cron
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
